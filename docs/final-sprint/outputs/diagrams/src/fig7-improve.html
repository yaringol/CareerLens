<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
body{background:#fff;margin:0;padding:26px 30px;font-family:'Segoe UI',Arial,sans-serif}
h1{font-size:24px;margin:0 0 4px;color:#1c2833}
h1 span{color:#1e8449}
.sub{font-size:14px;color:#5d6d7e;margin:0 0 14px}
</style></head><body>
<h1><span>Step 4: Improve</span></h1>
<p class="sub">The CV is improved section by section — the user stays in control.</p>
<pre class="mermaid">
flowchart LR
  W["Weak skills<br/>from the analysis"] --> SUG["💡 AI suggestion<br/>per CV section"]
  SUG --> EDIT["✏️ User edits &amp;<br/>saves each section"]
  EDIT --> MERGE["Merged improved CV"]
  MERGE --> EXP["⬇️ Export"]
</pre>
<script>mermaid.initialize({startOnLoad:true, theme:'neutral', flowchart:{htmlLabels:true, curve:'linear', nodeSpacing:70, rankSpacing:90, padding:14}, themeVariables:{fontFamily:'Segoe UI, Arial', fontSize:'17px', primaryColor:'#eafaf1', primaryBorderColor:'#1e8449', lineColor:'#37474f', primaryTextColor:'#1c2833'}});</script>
</body></html>
