<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{overflow:hidden;background:#fff}
body{background:#fff;margin:0;padding:26px 30px;font-family:'Segoe UI',Arial,sans-serif;width:880px}
h1{font-size:24px;margin:0 0 4px;color:#1c2833}
h1 span{color:#0b6e4f}
.sub{font-size:14px;color:#5d6d7e;margin:0 0 12px}
text{font-family:'Segoe UI',Arial,sans-serif}
</style></head><body>
<h1><span>Band separation</span> — the Match Score barely distinguishes fit</h1>
<p class="sub">Mean Match Score per band, 8 CVs &times; 3 real postings each. The full 0–10 scale is shown; the matched-vs-mismatched margin is 0.66 points.</p>
<svg width="820" height="330" viewBox="0 0 820 330">
  <!-- plot area x:70..800 y:20..280; scale 26px per point; gridlines 0,2,4,6,8,10 -->
  <g stroke="#eceff1" stroke-width="1">
    <line x1="70" y1="280" x2="800" y2="280"/>
    <line x1="70" y1="228" x2="800" y2="228"/>
    <line x1="70" y1="176" x2="800" y2="176"/>
    <line x1="70" y1="124" x2="800" y2="124"/>
    <line x1="70" y1="72" x2="800" y2="72"/>
    <line x1="70" y1="20" x2="800" y2="20"/>
  </g>
  <g font-size="12" fill="#78909c" text-anchor="end">
    <text x="60" y="284">0</text>
    <text x="60" y="232">2</text>
    <text x="60" y="180">4</text>
    <text x="60" y="128">6</text>
    <text x="60" y="76">8</text>
    <text x="60" y="24">10</text>
  </g>
  <text x="24" y="150" font-size="13" fill="#5d6d7e" transform="rotate(-90 24 150)" text-anchor="middle">Mean Match Score (0–10)</text>

  <!-- three bars w=120, centers 192, 435, 678 -->
  <!-- matched 4.50 -> h=117, y=163 -->
  <rect x="132" y="163" width="120" height="117" rx="4" fill="#2a78d6"/>
  <text x="192" y="156" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="600">4.50</text>
  <!-- adjacent 4.50 -->
  <rect x="375" y="163" width="120" height="117" rx="4" fill="#2a78d6"/>
  <text x="435" y="156" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="600">4.50</text>
  <!-- mismatched 3.84 -> h=99.8, y=180.2 -->
  <rect x="618" y="180.2" width="120" height="99.8" rx="4" fill="#2a78d6"/>
  <text x="678" y="173" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="600">3.84</text>

  <!-- margin bracket between matched top and mismatched top, at right side -->
  <g stroke="#5d6d7e" stroke-width="1.5" fill="none">
    <line x1="762" y1="163" x2="782" y2="163"/>
    <line x1="762" y1="180.2" x2="782" y2="180.2"/>
    <line x1="772" y1="163" x2="772" y2="180.2"/>
  </g>
  <text x="790" y="176" font-size="12" fill="#5d6d7e">0.66</text>

  <!-- x labels -->
  <g font-size="14" fill="#1c2833" text-anchor="middle">
    <text x="192" y="304">matched</text>
    <text x="435" y="304">adjacent</text>
    <text x="678" y="304">mismatched</text>
  </g>
  <text x="435" y="326" font-size="13" fill="#5d6d7e" text-anchor="middle">CV-to-posting band</text>
</svg>
</body></html>
