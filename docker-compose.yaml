services:
  model-server:
    container_name: model-server
    restart: always
    image: careerlens/model:main
    build:
      context: ds/model
      dockerfile: Dockerfile
    networks:
      - app-network

  mongodb:
    container_name: mongodb
    restart: always
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secretpassword
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    container_name: backend
    restart: always
    image: careerlens/backend:main
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://root:secretpassword@mongodb:27017/mydatabase?authSource=admin
      - MODEL_SERVER_URL=http://model-server:8000
      - JWT_SECRET=your-local-dev-secret
      - JWT_EXPIRY=7d
      - BCRYPT_ROUNDS=10
    depends_on:
      model-server:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    container_name: frontend
    restart: always
    image: careerlens/frontend:main
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80" # Access your app at http://localhost:8080
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
