; Ofelia cron sidecar config.
; Daily at 03:00 it launches a fresh `pipeline` container which scrapes -> retrains ->
; restarts the DS container. job-run starts a new container from the prebuilt image each
; run (built via the compose `pipeline` service), so nothing needs to stay running.
; Schedule is 6-field (sec min hour dom mon dow).
;
; MONGO_URI (with credentials) is deliberately NOT set here as `environment =` - this
; file is version-controlled and ofelia's INI parser does not reliably expand ${VAR}.
; Instead it's mounted from a gitignored file; copy secrets/mongo.env.example to
; secrets/mongo.env and fill in the real URI before starting ofelia. run_daily.sh
; sources it at container start.

[job-run "daily-pipeline"]
schedule = 0 0 3 * * *
image = careerlens/pipeline:main
network = app-network
volume = /var/run/docker.sock:/var/run/docker.sock
volume = model_data:/models
volume = ./secrets/mongo.env:/run/secrets/mongo.env:ro
environment = MODEL_OUT_DIR=/models
environment = DS_CONTAINER=careerlens-ds
